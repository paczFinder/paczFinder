apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-history-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-history-service
  template:
    metadata:
      labels:
        app: backend-history-service
    spec:
      containers:
        - name: backend-history-service
          image: backend-history-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_PROFILE
              value: "kubernetes"
          envFrom:
            - configMapRef:
                name: history-db-config
            - secretRef:
                name: history-db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend-history-service
spec:
  type: NodePort
  selector:
    app: backend-history-service
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30083

