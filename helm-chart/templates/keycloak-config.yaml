apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-db-config
data:
  DB_HOST: "keycloak-db"
  DB_NAME: "keycloak"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-db-secret
type: Opaque
stringData:
  DB_USERNAME: "keycloak"
  DB_PASSWORD: "keycloak"
---
apiVersion: v1
kind: Secret
metadata:
  name: keycloak-admin-secret
type: Opaque
stringData:
  KC_BOOTSTRAP_ADMIN_USERNAME: "admin"
  KC_BOOTSTRAP_ADMIN_PASSWORD: "admin"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keycloak-realm
data:
{{ (.Files.Glob "files/auth-realm-realm.json").AsConfig | indent 2 }}