apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-gateway
  template:
    metadata:
      labels:
        app: backend-gateway
    spec:
      containers:
        - name: api-gateway
          image: backend-gateway
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: KEYCLOAK_ISSUER_URI
              value: "http://localhost:30090/realms/auth-realm"
            - name: KEYCLOAK_JWKS_URI
              value: "http://keycloak:8080/realms/auth-realm/protocol/openid-connect/certs"
            - name: KEYCLOAK_AUDIENCE
              value: "paczfinder-api"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-gateway-service
spec:
  type: NodePort
  selector:
    app: backend-gateway
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080 # dostęp pod http://localhost:30080