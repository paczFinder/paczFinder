apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-delivery-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend-delivery-service
  template:
    metadata:
      labels:
        app: backend-delivery-service
    spec:
      containers:
        - name: backend-delivery-service
          image: backend-delivery-service
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: QUARKUS_PROFILE
              value: "kubernetes"
            - name: KEYCLOAK_ISSUER_URI
              value: "http://localhost:30090/realms/auth-realm"
            - name: KEYCLOAK_JWKS_AUTH_URL
              value: "http://keycloak:8080/realms/auth-realm"
            - name: KEYCLOAK_AUDIENCE
              value: "paczfinder-api"
          envFrom:
            - configMapRef:
                name: delivery-db-config
            - secretRef:
                name: delivery-db-secret
---
apiVersion: v1
kind: Service
metadata:
  name: backend-delivery-service
spec:
  type: ClusterIP
  selector:
    app: backend-delivery-service
  ports:
    - port: 8080
      targetPort: 8080
