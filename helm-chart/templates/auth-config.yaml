apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-db-config
data:
  DB_HOST: "auth-db"
  DB_PORT: "5432"
  DB_NAME: "authdb"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-db-secret
type: Opaque
stringData:
  DB_USER: "authuser"
  DB_PASSWORD: "authpass"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-keycloak-config
data:
  KEYCLOAK_SERVER_URL: "http://keycloak:8080"
  KEYCLOAK_REALM: "auth-realm"
  KEYCLOAK_CLIENT_ID: "auth-service"
  KEYCLOAK_ISSUER_URI: "http://localhost:30090/realms/auth-realm"
  KEYCLOAK_JWKS_URI: "http://keycloak:8080/realms/auth-realm/protocol/openid-connect/certs"
---
apiVersion: v1
kind: Secret
metadata:
  name: auth-keycloak-secret
type: Opaque
stringData:
  KEYCLOAK_CLIENT_SECRET: "auth-service-secret-change-in-prod"
  KEYCLOAK_ADMIN_USERNAME: "admin"
  KEYCLOAK_ADMIN_PASSWORD: "admin"