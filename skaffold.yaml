apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: paczfinder

build:
  local:
    push: false
  artifacts:
    - image: backend-gateway
      context: backend/api-gateway
      docker:
        dockerfile: Dockerfile

    - image: backend-delivery-service
      context: backend/delivery-service
      docker:
        dockerfile: Dockerfile

    - image: backend-routing-service
      context: backend/routing-service
      docker:
        dockerfile: Dockerfile

    - image: osrm
      context: .
      docker:
        dockerfile: infra/osrm/Dockerfile

deploy:
  helm:
    releases:
      - name: moj-system
        chartPath: helm-chart
        recreatePods: true

portForward:
  - resourceType: service
    resourceName: backend-gateway-service
    port: 8080
    localPort: 8080
  - resourceType: service
    resourceName: backend-delivery-service
    port: 8080
    localPort: 8081 # localhost:8081
  - resourceType: service
    resourceName: delivery-db
    port: 8080
    localPort: 8082 # localhost:8082
  - resourceType: service
    resourceName: backend-routing-service
    port: 8080
    localPort: 8083 # localhost:8083
  - resourceType: service
    resourceName: osrm
    port: 5000
    localPort: 5000 # localhost:5000