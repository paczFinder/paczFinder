apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: paczfinder

build:
  local:
    push: false
  artifacts:
    - image: backend-gateway
      context: backend/api-gateway
      docker:
        dockerfile: Dockerfile

    - image: backend-delivery-service
      context: backend/delivery-service
      docker:
        dockerfile: Dockerfile

    - image: auth-service
      context: backend/auth-service
      docker:
        dockerfile: Dockerfile

    - image: backend-history-service
      context: backend/history-service
      docker:
        dockerfile: Dockerfile

deploy:
  helm:
    releases:
      - name: moj-system
        chartPath: helm-chart
        recreatePods: true

portForward:
  - resourceType: service
    resourceName: backend-gateway-service
    port: 8080
    localPort: 8080
  - resourceType: service
    resourceName: backend-delivery-service
    port: 8080
    localPort: 8081 # localhost:8081
  - resourceType: service
    resourceName: delivery-db
    port: 5432
    localPort: 5433 # localhost:5433
  - resourceType: service
    resourceName: backend-auth-service
    port: 8080
    localPort: 8082 # localhost:8082
  - resourceType: service
    resourceName: backend-history-service
    port: 8080
    localPort: 8083 # localhost:8083
  - resourceType: service
    resourceName: history-db
    port: 5432
    localPort: 5436 # localhost:5436
  - resourceType: service
    resourceName: keycloak
    port: 8080
    localPort: 8180 # konsola Keycloaka
  - resourceType: service
    resourceName: auth-db
    port: 5432
    localPort: 5434 # localhost:5434
  - resourceType: service
    resourceName: keycloak-db
    port: 5432
    localPort: 5435 # localhost:5435