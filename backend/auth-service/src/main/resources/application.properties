spring.application.name=auth-service
server.port=8082
spring.web.error.include-message=always

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:authdb}
spring.datasource.username=${DB_USER:authuser}
spring.datasource.password=${DB_PASSWORD:authpass}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# OAuth2 Resource Server
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/auth-realm}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URI:http://localhost:8080/realms/auth-realm/protocol/openid-connect/certs}

# Wlasna konfiguracja Keycloak
keycloak.server-url=${KEYCLOAK_SERVER_URL:http://localhost:8080}
keycloak.realm=${KEYCLOAK_REALM:auth-realm}
keycloak.client-id=${KEYCLOAK_CLIENT_ID:auth-service}
keycloak.client-secret=${KEYCLOAK_CLIENT_SECRET:auth-service-secret-change-in-prod}
# client do rejestracji uzytkownikow
#keycloak.admin-client-id=${KEYCLOAK_ADMIN_CLIENT_ID:auth-service-admin}
#keycloak.admin-client-secret=${KEYCLOAK_ADMIN_CLIENT_SECRET:auth-service-admin-secret-change-in-prod}

keycloak.admin-username=${KEYCLOAK_ADMIN_USERNAME:admin}
keycloak.admin-password=${KEYCLOAK_ADMIN_PASSWORD:admin}

# Logging
logging.level.org.springframework.security=INFO
#logging.level.com.example.authservice=DEBUG
logging.level.root=INFO
logging.level.com.example.authservice=INFO