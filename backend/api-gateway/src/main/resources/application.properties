server.port=8080
spring.application.name=api-gateway

#spring.cloud.gateway.server.webflux.default-filters[0]=TokenRelay

spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins[0]=*
