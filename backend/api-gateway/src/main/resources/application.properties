server.port=8080
spring.application.name=api-gateway

# Routing do serwisu AUTH
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://backend-auth-service:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/auth/**

# Routing do serwisu API
spring.cloud.gateway.server.webflux.routes[1].id=api-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://backend-api-service:8080
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/**