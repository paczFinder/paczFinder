# Delivery service routes
spring.cloud.gateway.server.webflux.routes[0].id=delivery-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/deliveries/**,/trips/**,/vehicles/**

# History service routes
spring.cloud.gateway.server.webflux.routes[1].id=history-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://localhost:8083
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/history/**
