server.port=8080
spring.application.name=api-gateway

#spring.cloud.gateway.server.webflux.default-filters[0]=TokenRelay

spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-origins[0]=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-methods[0]=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowed-headers[0]=*

# Delivery service routes
spring.cloud.gateway.server.webflux.routes[0].id=delivery-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/deliveries/**