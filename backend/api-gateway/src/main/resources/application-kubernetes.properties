# Delivery service routes w klastrze K8s
spring.cloud.gateway.server.webflux.routes[0].id=delivery-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://backend-delivery-service:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/deliveries/**,/trips/**,/vehicles**

# Routing service route w klastrze K8s
spring.cloud.gateway.server.webflux.routes[1].id=routing-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://backend-routing-service:8080
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/routing/**