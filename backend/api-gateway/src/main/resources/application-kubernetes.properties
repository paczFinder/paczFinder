# Delivery service routes w klastrze K8s
spring.cloud.gateway.server.webflux.routes[0].id=delivery-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://backend-delivery-service:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/deliveries/**,/trips/**,/vehicles/**

# History service routes
spring.cloud.gateway.server.webflux.routes[1].id=history-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://backend-history-service:8080
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/history/**

# Route optimization service routes
spring.cloud.gateway.server.webflux.routes[2].id=route-optimization-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://backend-route-optimization-service:8080
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/optimization/**
