spring:
  application:
    name: route-optimization-service
  profiles:
    active: dev

delivery:
  base-url: ${DELIVERY_BASE_URL:http://localhost:8080}

routing:
  base-url: ${ROUTING_BASE_URL:http://localhost:8081}

history:
  base-url: ${HISTORY_BASE_URL:http://localhost:8083}

spring.cloud.openfeign:
  client:
    config:
      delivery-client:
        url: ${delivery.base-url}
      routing-client:
        url: ${routing.base-url}
      history-client:
        url: ${history.base-url}
